# bitcoind RPC settings (linearize-hashes)
rpcuser=someuser
rpcpassword=somepassword
#datadir=~/.bitcoin
host=127.0.0.1

#mainnet default
port=8332

#testnet default
#port=18332

#regtest default
#port=18443

#signet default
#port=38332

# bootstrap.dat hashlist settings (linearize-hashes)
max_height=313000

# bootstrap.dat input/output settings (linearize-data)

# mainnet
netmagic=e3c1a7d5
genesis=000008e43e5a666655a25fcca876dd75be95b7983a8ad01ea940c5ae9f341971
input=/home/example/.bitcurrency/blocks

# testnet
#netmagic=0c120a08
#genesis=00000b490a130b92169a5df76c875528a5ff766c304a8df6c9f9cbbbd8c81f0b
#input=/home/example/.bitcurrency/testnet3/blocks

# regtest
#netmagic=e4c2a8d6
#genesis=6e4181f65f8b53bfa47582d31e732406d83917581d5236875290ce205848f8ed
#input=/home/example/.bitcurrency/regtest/blocks

# signet
#netmagic=7281df37
#genesis=0000035337c183df6381bb32a867d5f3260dda1282320ca2f3330290040b2efa
#input=/home/example/.bitcurrency/signet/blocks

# "output" option causes blockchain files to be written to the given location,
# with "output_file" ignored. If not used, "output_file" is used instead.
# output=/home/example/blockchain_directory
output_file=/home/example/Downloads/bootstrap.dat
hashlist=hashlist.txt

# Maximum size in bytes of out-of-order blocks cache in memory
out_of_order_cache_sz = 100000000

# Do we want the reverse the hash bytes coming from getblockhash?
rev_hash_bytes = False

# On a new month, do we want to set the access and modify times of the new
# blockchain file?
file_timestamp = 0
# Do we want to split the blockchain files given a new month or specific height?
split_timestamp = 0

# Do we want debug printouts?
debug_output = False
